# Publishes one workspace package to npm when a `<pkg>@v<version>` tag is
# pushed, through npm trusted publishing: npm trusts this workflow, so no token
# exists, and each release carries provenance. Node 24 bundles an npm new
# enough for it. A tagged commit on main has passed the check workflow, so
# nothing is rerun.
#
# To release <pkg> <version> (e.g. pi-telegram-notify 0.2.2):
#   1. On a branch, run `npm version <version> -w packages/<pkg>`; it bumps
#      packages/<pkg>/package.json and package-lock.json only (see .npmrc).
#      Commit them in a PR titled `chore: release <pkg> <version>`.
#   2. Once it is squash-merged, tag its merged commit and push the tag:
#      git fetch && git tag <pkg>@v<version> "$(gh pr view <pr> --json mergeCommit --jq .mergeCommit.oid)"
#      git push origin <pkg>@v<version>
#   3. The release is out once npm serves it, a few minutes after the run
#      succeeds: `npm view @mcdp-adk/<pkg> versions` lists it.
#
# The trusted publisher is added once per package, before its first workflow
# release from this repo, and stays once it has published. Only a run that
# fails in `npm publish` with an authentication error means npm dropped it;
# the owner re-adds it with their npm 2FA login, then re-runs the job:
#   npm trust github @mcdp-adk/<pkg> --repo mcdp-adk/pi-packages --file publish.yml --allow-publish
name: publish

on:
  push:
    tags: ['*@v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: resolve package and verify version tag
        id: pkg
        run: |
          pkg="${GITHUB_REF_NAME%@v*}"
          ver="${GITHUB_REF_NAME#*@v}"
          if ! [[ "$pkg" =~ ^[a-z0-9-]+$ ]] || [ ! -f "packages/$pkg/package.json" ]; then
            echo "::error::unknown package directory for tag $GITHUB_REF_NAME (expected packages/$pkg/package.json)"
            exit 1
          fi
          PKG="$pkg" VER="$ver" node -e '
            const fs = require("node:fs");
            const pkg = process.env.PKG;
            const ver = process.env.VER;
            const manifest = JSON.parse(fs.readFileSync(`packages/${pkg}/package.json`, "utf8"));
            const expectedName = `@mcdp-adk/${pkg}`;
            if (manifest.name !== expectedName) {
              console.error(`::error::packages/${pkg}/package.json name ${manifest.name} does not match ${expectedName}`);
              process.exit(1);
            }
            if (typeof manifest.version !== "string" || !manifest.version || manifest.version !== ver) {
              console.error(`::error::tag version ${ver} does not match packages/${pkg}/package.json version ${manifest.version}`);
              process.exit(1);
            }
          '
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
      - name: the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: publish package to npm
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: npm publish --access public -w "packages/$PKG_NAME"
